name: Deploy to VPS

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle Cloud VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Code and Rebuild Containers
        run: |
          tar -czf - --exclude='.git' --exclude='.github' --exclude='frontend/node_modules' --exclude='backend/venv' . | ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "mkdir -p /home/ubuntu/portal-estudos-tcego && tar -xzf - -C /home/ubuntu/portal-estudos-tcego && cd /home/ubuntu/portal-estudos-tcego && docker compose up -d --build && docker image prune -f"
