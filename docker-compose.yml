version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: portal_estudos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal_pass}
      POSTGRES_DB: ${POSTGRES_DB:-portal_db}
    volumes:
      - portal_db_data:/var/lib/postgresql/data
      - ./db/dump.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal_user} -d ${POSTGRES_DB:-portal_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    container_name: portal_estudos_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portal_user}:${POSTGRES_PASSWORD:-portal_pass}@db:5432/${POSTGRES_DB:-portal_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: portal_estudos_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  portal_db_data:
